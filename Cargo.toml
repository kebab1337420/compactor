[package]
name = "compactor"
version = "0.1.0"
edition = "2021"
description = "Advanced lossless context-mixing compressor"

[lib]
name = "compactor"
path = "src/lib.rs"

[[bin]]
name = "compactor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Not `panic = "abort"`: the built-in server runs each request on its own
# thread, and a panic there must not take the whole process down.
